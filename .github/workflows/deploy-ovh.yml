# Met le site en ligne sur l'hébergement OVH à chaque modification du dossier site/ sur main.
#
# Réglages à faire une fois dans GitHub → Settings → Secrets and variables → Actions :
#   Variables : OVH_FTP_SERVER   (ex. ftp.cluster0XX.hosting.ovh.net, dans l'espace client OVH → FTP-SSH)
#               OVH_FTP_USER     (identifiant FTP principal)
#               OVH_FTP_PROTOCOL (facultatif : ftps par défaut ; mettre ftp si OVH refuse ftps)
#   Secret    : OVH_FTP_PASSWORD
#
# Configuration du formulaire (facultatif : sans LEAD_TO_EMAIL, un amane-config.php déposé à la main
# reste en place et n'est jamais écrasé). Elle est écrite dans amane-config.php, au-dessus de www/ :
#   Variables : LEAD_TO_EMAIL, LEAD_FROM_EMAIL, LEAD_FROM_NAME, ALLOWED_ORIGINS, CRM_URL
#   Secrets   : BREVO_API_KEY, CRM_SECRET
#
# Facultatif : VITE_WHATSAPP_NUMBER, VITE_CONTACT_EMAIL (coordonnées affichées près du formulaire).
# Chaque valeur peut être rangée indifféremment en variable ou en secret : le déploiement lit les deux.
# Tant que OVH_FTP_SERVER n'est renseigné nulle part, le déploiement est simplement ignoré.

name: Déploiement OVH

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-ovh.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Les secrets ne sont pas lisibles dans la condition d'un job : ce premier job regarde si l'hébergement
  # est configuré, sans jamais afficher de valeur.
  reglages:
    runs-on: ubuntu-latest
    outputs:
      ftp: ${{ steps.lire.outputs.ftp }}
      formulaire: ${{ steps.lire.outputs.formulaire }}
    steps:
      - id: lire
        env:
          SERVEUR: ${{ vars.OVH_FTP_SERVER || secrets.OVH_FTP_SERVER }}
          UTILISATEUR: ${{ vars.OVH_FTP_USER || secrets.OVH_FTP_USER }}
          MOT_DE_PASSE: ${{ secrets.OVH_FTP_PASSWORD || vars.OVH_FTP_PASSWORD }}
          DESTINATAIRE: ${{ vars.LEAD_TO_EMAIL || secrets.LEAD_TO_EMAIL }}
        run: |
          ok=false; [ -n "$SERVEUR" ] && ok=true
          echo "ftp=$ok" >> "$GITHUB_OUTPUT"
          f=false; [ -n "$DESTINATAIRE" ] && f=true
          echo "formulaire=$f" >> "$GITHUB_OUTPUT"
          for n in SERVEUR UTILISATEUR MOT_DE_PASSE DESTINATAIRE; do
            if [ -n "${!n}" ]; then echo "$n : renseigné"; else echo "$n : absent"; fi
          done
          if [ "$ok" = true ] && { [ -z "$UTILISATEUR" ] || [ -z "$MOT_DE_PASSE" ]; }; then
            echo "::error::OVH_FTP_USER ou OVH_FTP_PASSWORD manque dans GitHub (Settings → Secrets and variables → Actions)."
            exit 1
          fi

  deploy:
    needs: reglages
    if: ${{ needs.reglages.outputs.ftp == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Dépendances
        run: npm ci --no-audit --no-fund

      - name: Tests du formulaire (JavaScript et PHP)
        run: npm test

      - name: Construction du dossier www/
        run: npm run ovh
        env:
          VITE_WHATSAPP_NUMBER: ${{ vars.VITE_WHATSAPP_NUMBER }}
          VITE_CONTACT_EMAIL: ${{ vars.VITE_CONTACT_EMAIL }}

      - name: Envoi sur OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.OVH_FTP_SERVER || secrets.OVH_FTP_SERVER }}
          username: ${{ vars.OVH_FTP_USER || secrets.OVH_FTP_USER }}
          password: ${{ secrets.OVH_FTP_PASSWORD || vars.OVH_FTP_PASSWORD }}
          protocol: ${{ vars.OVH_FTP_PROTOCOL || secrets.OVH_FTP_PROTOCOL || 'ftps' }}
          local-dir: site/dist-ovh/
          server-dir: www/

      # La configuration du formulaire : écrite par PHP lui-même (var_export), donc sans risque
      # qu'un caractère d'une valeur casse le fichier. Elle n'est jamais dans www/.
      - name: Configuration du formulaire
        if: ${{ needs.reglages.outputs.formulaire == 'true' }}
        working-directory: ${{ runner.temp }}
        env:
          LEAD_TO_EMAIL: ${{ vars.LEAD_TO_EMAIL || secrets.LEAD_TO_EMAIL }}
          LEAD_FROM_EMAIL: ${{ vars.LEAD_FROM_EMAIL || secrets.LEAD_FROM_EMAIL }}
          LEAD_FROM_NAME: ${{ vars.LEAD_FROM_NAME || secrets.LEAD_FROM_NAME }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS || secrets.ALLOWED_ORIGINS }}
          CRM_URL: ${{ vars.CRM_URL || secrets.CRM_URL }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || vars.BREVO_API_KEY }}
          CRM_SECRET: ${{ secrets.CRM_SECRET || vars.CRM_SECRET }}
        run: |
          mkdir -p amane-config
          php -r '
            $cles = ["BREVO_API_KEY", "LEAD_TO_EMAIL", "LEAD_FROM_EMAIL", "LEAD_FROM_NAME", "ALLOWED_ORIGINS", "CRM_URL", "CRM_SECRET"];
            $config = [];
            foreach ($cles as $cle) { $config[$cle] = trim((string) getenv($cle)); }
            if ($config["LEAD_FROM_NAME"] === "") { $config["LEAD_FROM_NAME"] = "Amane"; }
            file_put_contents("amane-config/amane-config.php", "<?php\n// Écrit par le déploiement GitHub : ne pas modifier ici.\nreturn " . var_export($config, true) . ";\n");
          '
          php -l amane-config/amane-config.php

      - name: Envoi de la configuration, au-dessus de www/
        if: ${{ needs.reglages.outputs.formulaire == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.OVH_FTP_SERVER || secrets.OVH_FTP_SERVER }}
          username: ${{ vars.OVH_FTP_USER || secrets.OVH_FTP_USER }}
          password: ${{ secrets.OVH_FTP_PASSWORD || vars.OVH_FTP_PASSWORD }}
          protocol: ${{ vars.OVH_FTP_PROTOCOL || secrets.OVH_FTP_PROTOCOL || 'ftps' }}
          local-dir: ${{ runner.temp }}/amane-config/
          server-dir: ./
          state-name: .amane-config-sync-state.json

