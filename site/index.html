<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3B0C15" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      (function (h) {
        h.classList.add('js');
        // Si le script principal n'est pas arrivé au bout de 7 s, la page s'affiche sans animation.
        setTimeout(function () {
          if (!h.classList.contains('pret')) h.classList.remove('js');
        }, 7000);
      })(document.documentElement);
    </script>
    <!--head-->
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
